name: pygwater
channels:
  - conda-forge
  - nodefaults
dependencies:
  # tested with python 3.13, numpy 2.5, scipy 1.18, h5py 3.16, netCDF4 1.7, geopandas 1.2, shapely 2.2
  - python>=3.10
  - numpy>=1.24
  - scipy>=1.10
  - h5py>=3.8
  - netcdf4>=1.6
  # regional masks (pygwater.mesh)
  - geopandas>=0.13
  - shapely>=2.0
  # tests
  - pytest>=7
  # figures in examples/ and studies/ (pygmt is optional; it can also live in a separate env)
  - pygmt
